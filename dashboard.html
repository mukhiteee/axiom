<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00ffff">
  <title>Dashboard // AXIOM</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/habits.css">
  <link rel="stylesheet" href="css/analytics.css">
  <link rel="stylesheet" href="css/overview-tab.css">
  <link rel="manifest" href="/manifest.json">
  
  <!-- Theme loads first -->
  <script src="js/theme.js"></script>
</head>
<body>
  
  <!-- Dashboard Shell -->
  <div class="dashboard">
    
    <!-- Sidebar Navigation (Static) -->
    <aside class="sidebar" id="sidebar">
      
      <!-- Sidebar Header -->
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2 17l10 5 10-5"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2 12l10 5 10-5"/>
            </svg>
          </div>
        </div>
      </div>
      
      <!-- Navigation Menu -->
      <nav class="sidebar-nav">
        <a href="#overview" class="nav-item active" data-view="overview">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
        </a>
        
        <a href="#habits" class="nav-item" data-view="habits">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
          </svg>
        </a>
        
        <a href="#calendar" class="nav-item" data-view="calendar">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </a>
        
        <a href="#analytics" class="nav-item" data-view="analytics">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3v18h18"/>
            <path d="M18 17V9"/>
            <path d="M13 17V5"/>
            <path d="M8 17v-3"/>
          </svg>
        </a>
        
        <a href="#wrapped" class="nav-item" data-view="wrapped">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        </a>
        
        <div class="nav-divider"></div>
        
        <a href="#profile" class="nav-item" data-view="profile">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </a>
        
        <a href="#settings" class="nav-item" data-view="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v6m0 6v6M5.6 5.6l4.2 4.2m4.2 4.2l4.2 4.2M1 12h6m6 0h6M5.6 18.4l4.2-4.2m4.2-4.2l4.2-4.2"/>
          </svg>
        </a>
      </nav>
      
      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">
            <span>U</span>
          </div>
        </div>
        
        <button class="logout-btn" id="logout-btn" title="Sign Out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
      
    </aside>
    
    <!-- Main Content Area (Dynamic) -->
    <main class="main-content" id="main-content">
      <!-- Content loaded dynamically from pages/ -->
      <div class="loading-screen">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>
    </main>
    
  </div>

  <!-- Scripts --><!-- Scripts -->
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/analytics.js"></script>

</body>
</html>
